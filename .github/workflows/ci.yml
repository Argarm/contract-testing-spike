name: CI

on:
  push:
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run checkout-service consumer tests
        run: ./gradlew :checkout-service:test --no-daemon

      - name: Verify catalog-service provider contract
        run: ./gradlew :catalog-service:test --no-daemon

      - name: Run all tests
        run: ./gradlew test --no-daemon

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: contract-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up --build -d

      - name: Check catalog-service
        run: curl --fail --retry 10 --retry-delay 2 http://localhost:8081/products/p-100

      - name: Check checkout-service
        run: curl --fail --retry 10 --retry-delay 2 http://localhost:8082/health

      - name: Stop services
        if: always()
        run: docker compose down --volumes