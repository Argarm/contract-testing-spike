services:
  catalog-service:
    build:
      context: .
      dockerfile: docker/catalog-service.Dockerfile
    ports:
      - "8081:8081"

  checkout-service:
    build:
      context: .
      dockerfile: docker/checkout-service.Dockerfile
    environment:
      CATALOG_BASE_URL: http://catalog-service:8081
    depends_on:
      - catalog-service
    ports:
      - "8082:8082"