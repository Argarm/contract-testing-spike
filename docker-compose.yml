services:
  catalog-service:
    build:
      context: .
      dockerfile: docker/catalog-service.Dockerfile
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/products/p-100"]
      interval: 5s
      timeout: 3s
      retries: 10

  checkout-service:
    build:
      context: .
      dockerfile: docker/checkout-service.Dockerfile
    environment:
      CATALOG_BASE_URL: http://catalog-service:8081
    depends_on:
      catalog-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10